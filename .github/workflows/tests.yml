name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      # Dependencies only, never `-e .`: pyproject declares a `neuralchild` package
      # that does not exist in this flat layout, so building the project fails (#10).
      # The suite imports through pythonpath, exactly as it does locally.
      - name: Install
        run: |
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r pyproject.toml --extra dev

      - name: Collection succeeds
        run: pytest --collect-only -q

      - name: Failures match tests/known_failures.txt
        run: |
          pytest -q --tb=no -rf > pytest.out 2>&1 || true
          tail -1 pytest.out
          grep '^FAILED ' pytest.out | sed 's/^FAILED //; s/ .*//; s/\[.*//' | sort -u > actual.txt
          grep -v '^#' tests/known_failures.txt | grep -v '^[[:space:]]*$' | sort -u > expected.txt
          if diff expected.txt actual.txt > delta.txt; then
            echo "$(wc -l < expected.txt) known failures, no regressions."
            exit 0
          fi
          echo "::error::Actual failures do not match tests/known_failures.txt"
          echo "Lines marked '<' now pass — delete them from tests/known_failures.txt."
          echo "Lines marked '>' are new failures — fix them."
          cat delta.txt
          exit 1

      - name: Report
        if: always()
        run: tail -20 pytest.out || true

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not just the tip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      # Only the two tools these checks need. This job never imports the project,
      # so it skips torch and stays fast.
      - name: Install
        run: uv pip install --system ruff pip-audit

      - name: Formatting
        run: ruff format --check .

      # A ratchet, not a full lint. `ruff check .` reports 419 violations — the
      # pathlib, logging-format and complexity families, plus the F821 undefined
      # names that #6 and #9 own — so it cannot gate yet. These families are at
      # zero today and this keeps them there. Add F821 when #6 and #9 land, and
      # F401 once cli.py stops importing colorama.Back unused.
      - name: Lint the rules already at zero
        run: ruff check --select I,F811,E4,E7,E9 .

      # Covers what requirements.txt pins. The runtime dependencies declared in
      # pyproject are NOT audited here: that needs the project to build, which
      # fails (#10).
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt

      # Pinned to the version the audit runbook uses locally, rather than an
      # action, so CI and a developer's machine scan with identical rules.
      - name: Secrets
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git -v .
