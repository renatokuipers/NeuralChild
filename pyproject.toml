[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralchild"
version = "0.1.0"
description = "A psychological brain simulation"
readme = "README.md"
authors = [{ name = "NeuralChild Team" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.25.0",
    "pyyaml>=6.0",
    "numpy>=1.20.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=0.9.0",
]

[project.scripts]
neuralchild = "neuralchild.cli:main"

[tool.setuptools]
packages = ["neuralchild"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
explicit_package_bases = true
exclude = ['(^|/)(\.venv|build|dist|logs)/']
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["dash_bootstrap_components.*", "plotly.*", "pandas.*", "colorama.*"]
ignore_missing_imports = true

[tool.ruff.lint]
extend-select = ["NPY", "PERF", "S", "PTH", "TRY", "ARG", "LOG", "G", "DTZ", "ERA", "C901"]
ignore = ["S311"] 

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] 

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff]
target-version = "py311"

[tool.vulture]
min_confidence = 80
paths = ["."]
ignore_decorators = ["@app.callback", "@validator", "@field_validator",
                     "@root_validator", "@model_validator", "@pytest.fixture"]
ignore_names = ["n_intervals", "arbitrary_types_allowed", "validate_assignment",
                "extra", "frame", "sig"]